<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>{% block title %}PsyMonitor{% endblock %}</title>
</head>
{#- Email clients ignore <style> blocks and most layout CSS, so this is tables + inline styles only. -#}
{%- set accent = accent | default('#0F7A5F') %}
<body style="margin:0; padding:0; background:#F1F5F9; font-family:Segoe UI, Helvetica, Arial, sans-serif; color:#0F172A;">
<div style="display:none; max-height:0; overflow:hidden; opacity:0;">{% block preheader %}{% endblock %}</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#F1F5F9;">
  <tr>
    <td align="center" style="padding:24px 12px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:580px; background:#FFFFFF; border-radius:14px; overflow:hidden; border:1px solid #E2E8F0;">
        <tr>
          <td style="background:{{ accent }}; padding:20px 28px;">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td style="font-size:20px; font-weight:800; color:#FFFFFF; letter-spacing:0.2px;">PsyMonitor</td>
              </tr>
              <tr>
                <td style="font-size:12px; color:#FFFFFF; opacity:0.85; padding-top:2px;">{% block tagline %}Mental Disorder Detection{% endblock %}</td>
              </tr>
            </table>
          </td>
        </tr>
        {% block banner %}{% endblock %}
        <tr>
          <td style="padding:28px; font-size:15px; line-height:1.6; color:#334155;">
            {% if recipient_name %}<p style="margin:0 0 16px;">{% block greeting %}Hi {{ recipient_name }},{% endblock %}</p>{% endif %}
            {% block content %}{% endblock %}
          </td>
        </tr>
        <tr>
          <td style="padding:18px 28px 24px; border-top:1px solid #E2E8F0; font-size:12px; line-height:1.6; color:#64748B;">
            You're receiving this because you have a PsyMonitor account and this message is about your care or your account.
            These notifications can't be unsubscribed from individually; to stop them, email
            <a href="mailto:{{ support_email }}" style="color:#0F7A5F;">{{ support_email }}</a>.
            <br>&copy; {{ year }} Mental Disorder Detection &middot; This is an automated message, please don't reply.
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
