{#- Call-to-action link styled as a button (works in Gmail/Outlook): include with href, label, color -#}
<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:22px 0 8px;">
  <tr>
    <td style="border-radius:10px; background:{{ color | default('#0F7A5F') }};">
      <a href="{{ href }}" style="display:inline-block; padding:12px 22px; font-size:15px; font-weight:700; color:#FFFFFF; text-decoration:none; border-radius:10px;">{{ label }}</a>
    </td>
  </tr>
</table>
<p style="margin:0; font-size:12px; color:#64748B;">Or open this link: <a href="{{ href }}" style="color:{{ color | default('#0F7A5F') }}; word-break:break-all;">{{ href }}</a></p>
