{#- Line icons for the portal sign-in, register and role-picker pages. -#}
{% macro icon(name, size=20) -%}

{%- elif name == 'clipboard' -%}<rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="m9 14 2 2 4-4"/>
{%- elif name == 'watch' -%}<circle cx="12" cy="12" r="6"/><path d="M12 10v2l1 1"/><path d="m16.1 7.5-.6-4.1a2 2 0 0 0-2-1.7h-3a2 2 0 0 0-2 1.7l-.6 4.1"/><path d="m7.9 16.5.6 4.1a2 2 0 0 0 2 1.7h3a2 2 0 0 0 2-1.7l.6-4.1"/>

{%- elif name == 'pulse' -%}<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>

{%- elif name == 'check' -%}<path d="M20 6 9 17l-5-5"/>
{%- elif name == 'arrow' -%}<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>
{%- endif -%}
</svg>
{%- endmacro %}
